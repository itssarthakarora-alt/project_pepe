<body class="register-page">
    <div class="login-container">
        <!-- Left Side: Branding/Welcome -->
        <div class="login-left">
            <div class="branding">
                <!-- Using the generated logo here -->
                <img src="https://pepecards.mobi/image/rectangle-logo.png" alt="Pepe Card Logo" class="brand-logo">
                <h1>JOIN PEPECARDS</h1>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="login-right">
            <div class="language-selector">
                <i class="fa-solid fa-globe"></i>
            </div>

            <form class="login-form" method="POST" action="https://pepecards.mobi/register.php">
                                <div class="input-group">
                    <label for="username"><span>|</span> Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password"><span>|</span> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye-slash toggle-password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="quantum-password"><span>|</span> Secondary Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="quantum-password" name="quantum_password"
                            placeholder="Enter secondary password" required>
                        <i class="fa-solid fa-eye-slash toggle-password"></i>
                    </div>
                </div>

                <div class="captcha-group">
                    <span class="captcha-question">6 - 3 = ?</span>
                    <input type="text" placeholder="Equals?" class="captcha-input">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-login">REGISTER</button>
                    <a href="https://pepecards.mobi/" class="btn btn-register"
                        style="text-align: center; text-decoration: none; display: block;">LOGIN</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const quantumPassword = document.getElementById('quantum-password').value;

            if (password === quantumPassword) {
                e.preventDefault();
                alert('Quantum Password must be different from the primary Password.');
            }
        });

        // Toggle Password Visibility
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                }
            });
        });
    </script>
